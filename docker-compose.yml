# ─────────────────────────────────────────────────────────────────────────────
# Infra local do Aurum. Desenvolvimento apenas.
#
# As senhas têm default de dev porque este compose não é o de produção: o banco
# só escuta em localhost e o volume é descartável. Sobrescreva qualquer uma
# exportando a variável antes do `docker compose up`.
#
# Subir:     pnpm db:up
# Zerar:     pnpm db:reset      (apaga o volume — é o único jeito de o init rodar de novo)
# E-mails:   http://localhost:8025
# ─────────────────────────────────────────────────────────────────────────────
name: aurum

services:
  db:
    image: postgres:17-alpine
    container_name: aurum-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurum
      # Superusuário. Existe só para o init criar as duas roles reais.
      # A aplicação nunca conecta com ele.
      POSTGRES_USER: aurum_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-owner_dev}
      # Lidas por docker/postgres/init/00-roles.sh
      AURUM_AUTH_PASSWORD: ${AURUM_AUTH_PASSWORD:-auth_dev}
      AURUM_APP_PASSWORD: ${AURUM_APP_PASSWORD:-app_dev}
      # Data civil do projeto é America/Sao_Paulo; o container fala UTC por padrão.
      TZ: America/Sao_Paulo
    # 5434 no host, de propósito — nesta máquina a 5432 é de um Postgres nativo e
    # a 5433 é do valori-crm. Vale saber do modo de falha da 5432: o Docker binda
    # em *:5432 e não reclama, mas o Postgres nativo binda em [::1]:5432, que é
    # mais específico e ganha o `localhost`. O sintoma é conversar com o banco
    # errado e receber `role "aurum_auth" does not exist` — que não lembra em
    # nada um conflito de porta.
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - aurum-pgdata:/var/lib/postgresql/data
      # Roda só quando o volume nasce vazio. Mexeu no init? `pnpm db:reset`.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurum_owner -d aurum"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Captura o e-mail de confirmação de cadastro sem enviar nada para fora.
  # Em produção o mesmo código aponta para o SMTP do Resend — só muda SMTP_URL.
  mail:
    image: axllent/mailpit:v1.30.7
    container_name: aurum-mail
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 500
    ports:
      - "${SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_UI_PORT:-8025}:8025" # interface web
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  aurum-pgdata:
